<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>다 같이 함께 저녁을</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1>다 같이 함께 저녁을</h1>
      <div class="month-nav">
        <button id="prevBtn" type="button" aria-label="이전 달">&#8249;</button>
        <span id="monthLabel" aria-live="polite"></span>
        <button id="nextBtn" type="button" aria-label="다음 달">&#8250;</button>
        <button id="todayBtn" type="button" class="today-btn">오늘로 이동</button>
      </div>
    </header>

    <div id="timeNotice" class="notice" role="status"></div>
    <div id="storageNotice" class="notice warn" role="alert" hidden></div>

    <div id="rankBanner" class="rank-banner" role="status" hidden></div>

    <section class="calendar" aria-label="캘린더">
      <div class="weekdays">
        <span class="sun">일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span class="sat">토</span>
      </div>
      <div id="grid" class="grid"></div>
    </section>

    <section id="deptBattle" class="battle" aria-labelledby="battleTitle" hidden>
      <h2 id="battleTitle">🏆 부서 대항전 <span id="battleMonth" class="count"></span></h2>
      <ol id="battleList" class="battle-list"></ol>
    </section>

    <section class="comments" aria-labelledby="commentsTitle">
      <h2 id="commentsTitle">자유 코멘트 <span id="commentCount" class="count"></span></h2>
      <form id="commentForm" novalidate>
        <input id="commentAuthor" type="text" maxlength="20" placeholder="작성자 (선택)" aria-label="작성자" autocomplete="off">
        <textarea id="commentText" maxlength="300" rows="3" placeholder="회식 관련 의견이나 하고 싶은 말을 자유롭게 남겨 주세요." aria-label="코멘트 내용"></textarea>
        <div class="comment-actions">
          <span id="commentError" class="error" role="alert"></span>
          <button type="submit" class="primary">코멘트 남기기</button>
        </div>
      </form>
      <ul id="commentList" class="comment-list"></ul>
    </section>
  </main>

  <!-- 참여 등록 모달 -->
  <div id="registerModal" class="modal" hidden>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="registerTitle">
      <h2 id="registerTitle">참여 등록</h2>
      <p id="registerDate" class="modal-date"></p>
      <form id="registerForm" novalidate>
        <label for="deptInput">부서명</label>
        <input id="deptInput" type="text" maxlength="30" autocomplete="off">
        <label for="nameInput">이름</label>
        <input id="nameInput" type="text" maxlength="20" autocomplete="off">
        <fieldset class="mood-set">
          <legend>오늘의 기분 (선택)</legend>
          <div id="moodGroup" class="mood-group"></div>
        </fieldset>
        <p id="formError" class="error" role="alert"></p>
        <div class="actions">
          <button type="button" class="secondary" data-close>취소</button>
          <button type="submit" class="primary">등록 완료</button>
        </div>
        <p class="time-hint">참여 및 취소는 13:00~17:00</p>
      </form>
    </div>
  </div>

  <!-- 참여자 목록 모달 -->
  <div id="listModal" class="modal" hidden>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="listTitle">
      <h2 id="listTitle">참여자 목록</h2>
      <p id="listSummary" class="modal-date"></p>
      <ul id="participantList" class="participants"></ul>
      <div id="menuReco" class="menu-reco" hidden></div>
      <div id="voteBox" class="vote-box" hidden>
        <h3>🗳️ 메뉴 투표</h3>
        <label for="voterSelect">투표하는 사람</label>
        <select id="voterSelect"></select>
        <ul id="voteList" class="vote-list"></ul>
        <div class="roulette">
          <button type="button" id="rouletteBtn">🎰 메뉴 룰렛 돌리기</button>
          <div id="rouletteResult" class="roulette-result" aria-live="polite"></div>
        </div>
      </div>
      <div class="actions">
        <button type="button" id="addBtn" class="primary">참여 등록</button>
        <button type="button" class="secondary" data-close>닫기</button>
      </div>
      <p class="time-hint">참여 및 취소는 13:00~17:00</p>
    </div>
  </div>

  <div id="dayTip" class="day-tip" role="tooltip" hidden></div>
  <div id="toast"class="toast" role="status" aria-live="polite"></div>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
